# Deploys STOL to Telegram Serverless (tgcloud): the Mini App build (dist-miniapp/)
# plus the bot code in tgcloud/. See docs/telegram.md.
#
# One-time setup: GitHub → Settings → Secrets and variables → Actions →
# New repository secret, name TGCLOUD_TOKEN, value = the CLI access token from
# @BotFather → bot → Serverless → CLI Access (format app<id>:<secret>).
name: Telegram deploy

on:
  workflow_dispatch:
  push:
    branches: [main, claude/figma-color-policy-m0a64c]
    paths:
      - "mini-app/**"
      - "src/**"
      - "public/**"
      - "tgcloud/**"
      - "tgcloud.jsonc"
      - "vite.miniapp.config.ts"
      - "package.json"
      - ".github/workflows/telegram-deploy.yml"

permissions:
  contents: read

concurrency:
  group: telegram-deploy
  cancel-in-progress: false

env:
  TGCLOUD_CLI: "@tgcloud/cli@0.2.0"
  MINI_APP_URL: https://app8805316759.tgcloud.ai/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check TGCLOUD_TOKEN secret
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::error::TGCLOUD_TOKEN secret topilmadi. Settings → Secrets and variables → Actions → New repository secret orqali qo'shing, keyin bu ishni qayta ishga tushiring (Re-run jobs)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is out of sync with package.json, so `npm ci` fails;
      # resolve fresh without touching the lockfile.
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build Mini App
        run: npm run miniapp:build

      # A fresh checkout has no .tgcloud/ state; fetch records the cloud revision
      # (working files untouched) so push stays a checked, conditional deploy.
      - name: Sync tgcloud snapshot
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx -y "$TGCLOUD_CLI" fetch

      - name: Push to Telegram
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx -y "$TGCLOUD_CLI" push

      - name: Verify Mini App is served
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors -o /dev/null "$MINI_APP_URL" \
            || { echo "::error::$MINI_APP_URL javob bermadi. Push chiqargan URL'ni tgcloud/lib/app.js dagi MINI_APP_URL bilan solishtiring."; exit 1; }

      - name: Webhook status
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx -y "$TGCLOUD_CLI" --no-pager webhook

      - name: Summary
        run: |
          {
            echo "### STOL Telegram'ga joylandi"
            echo ""
            echo "- Mini App: $MINI_APP_URL"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Tekshirish: botga /start yozing"
          } >> "$GITHUB_STEP_SUMMARY"
